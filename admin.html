<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>B07 Admin</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="admin-page">

    <div class="container">

      <header class="admin-header">
        <p class="eyebrow">B07 PORTFOLIO</p>

        <h1>لوحة الإدارة</h1>

        <p>
          إدارة المشاريع والمحتوى.
        </p>
      </header>


      <section class="admin-card">

        <h2>تسجيل الدخول</h2>

        <form id="login-form">

          <label for="email">
            البريد الإلكتروني
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          >


          <label for="password">
            كلمة المرور
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          >


          <button
            type="submit"
            class="button button-primary"
          >
            دخول
          </button>

        </form>

        <p
          id="login-message"
          aria-live="polite"
        ></p>

      </section>

    </div>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="admin.js" defer></script>

</body>
</html>
