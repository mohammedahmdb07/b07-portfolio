<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="محمد أحمد — مصمم جرافيك متخصص في البوسترات والفيديوهات والمواقع الإلكترونية."
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <title>محمد أحمد | B07 Portfolio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div class="container nav-container">

      <a
        href="index.html"
        class="logo"
        aria-label="محمد أحمد"
      >
        B07
      </a>

      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        aria-label="فتح القائمة"
        aria-expanded="false"
        aria-controls="main-navigation"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav
        class="main-nav"
        id="main-navigation"
        aria-label="التنقل الرئيسي"
      >

        <a href="index.html">
          الرئيسية
        </a>

        <a href="projects.html">
          المشاريع
        </a>

        <a href="about.html">
          عنّي
        </a>

        <a href="contact.html">
          تواصل
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <!-- =========================
         HERO
    ========================== -->

    <section
      id="home"
      class="hero"
      aria-labelledby="hero-title"
    >

      <div class="container hero-content">

        <p class="eyebrow">
          B07 PORTFOLIO
        </p>

        <h1 id="hero-title">
          محمد أحمد

          <span>
            مصمم جرافيك
          </span>
        </h1>

        <p class="hero-description">
          مصمم جرافيك، أصمم البوسترات والفيديوهات
          والمواقع الإلكترونية، وأحوّل الأفكار إلى
          أعمال بصرية مختلفة ومميزة.
        </p>

        <div class="hero-actions">

          <a
            href="projects.html"
            class="button button-primary"
          >
            استكشف المشاريع
          </a>

          <a
            href="contact.html"
            class="button button-secondary"
          >
            تواصل معي
          </a>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="site-footer">

    <div class="container footer-content">

      <p>
        ©
        <span id="current-year"></span>
        B07 Portfolio
      </p>

      <a href="index.html">
        العودة للأعلى
      </a>

    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    "use strict";


    /* =========================
       CURRENT YEAR
    ========================== */

    const yearElement =
      document.getElementById(
        "current-year"
      );

    if (yearElement) {

      yearElement.textContent =
        new Date().getFullYear();

    }


    /* =========================
       MOBILE MENU
    ========================== */

    const menuToggle =
      document.getElementById(
        "menu-toggle"
      );

    const mainNavigation =
      document.getElementById(
        "main-navigation"
      );


    if (
      menuToggle &&
      mainNavigation
    ) {

      menuToggle.addEventListener(
        "click",
        () => {

          const isOpen =
            menuToggle.getAttribute(
              "aria-expanded"
            ) === "true";


          menuToggle.setAttribute(
            "aria-expanded",
            String(!isOpen)
          );


          mainNavigation.classList.toggle(
            "is-open"
          );

        }
      );


      mainNavigation
        .querySelectorAll("a")
        .forEach((link) => {

          link.addEventListener(
            "click",
            () => {

              menuToggle.setAttribute(
                "aria-expanded",
                "false"
              );


              mainNavigation.classList.remove(
                "is-open"
              );

            }
          );

        });

    }

  </script>

</body>

</html>
