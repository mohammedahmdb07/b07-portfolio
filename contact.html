<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تواصل مع محمد أحمد — مصمم جرافيك.">
  <meta name="theme-color" content="#080808">
  <title>تواصل | محمد أحمد</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="logo" aria-label="محمد أحمد">B07</a>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-label="فتح القائمة" aria-expanded="false" aria-controls="main-navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="main-nav" id="main-navigation" aria-label="التنقل الرئيسي">
        <a href="index.html">الرئيسية</a>
        <a href="projects.html">المشاريع</a>
        <a href="about.html">عنّي</a>
        <a href="contact.html" aria-current="page">تواصل</a>
      </nav>
    </div>
  </header>

  <!-- MAIN -->
  <main>
    <section class="contact-section section" aria-labelledby="contact-title">
      <div class="container">
        <div class="contact-card">
          <p class="eyebrow">CONTACT</p>
          <h1 id="contact-title">عندك فكرة؟</h1>
          <p>لو عندك مشروع، فكرة، أو محتاج تصميم، تواصل معي ونبدأ نشتغل عليها.</p>
          <div class="hero-actions contact-actions">
            <!-- WHATSAPP -->
            <a href="https://wa.me/249112854369" class="button button-primary" target="_blank" rel="noopener noreferrer">واتساب</a>
            <!-- TELEGRAM -->
            <a href="https://t.me/201040931342" class="button button-secondary" target="_blank" rel="noopener noreferrer">تيليجرام</a>
            <!-- EMAIL -->
            <a href="mailto:mohammedahmdb07@gmail.com" class="button button-secondary">البريد الإلكتروني</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-content">
      <p>© <span id="current-year"></span> B07 Portfolio</p>
      <a href="index.html">العودة للرئيسية</a>
    </div>
  </footer>

  <!-- JAVASCRIPT -->
  <script>
    "use strict";
    const yearElement = document.getElementById("current-year");
    if (yearElement) yearElement.textContent = new Date().getFullYear();

    const menuToggle = document.getElementById("menu-toggle");
    const mainNavigation = document.getElementById("main-navigation");
    if (menuToggle && mainNavigation) {
      menuToggle.addEventListener("click", () => {
        const isOpen = menuToggle.getAttribute("aria-expanded") === "true";
        menuToggle.setAttribute("aria-expanded", String(!isOpen));
        mainNavigation.classList.toggle("is-open");
      });
      mainNavigation.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          menuToggle.setAttribute("aria-expanded", "false");
          mainNavigation.classList.remove("is-open");
        });
      });
    }
  </script>
  <script src="motion.js" defer></script>
</body>
</html>
