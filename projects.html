<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="مشاريع محمد أحمد — معرض الأعمال والتصاميم."
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <title>المشاريع | محمد أحمد</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <div class="container nav-container">

      <a
        href="index.html"
        class="logo"
        aria-label="محمد أحمد"
      >
        B07
      </a>


      <button
        class="menu-toggle"
        id="menu-toggle"
        type="button"
        aria-label="فتح القائمة"
        aria-expanded="false"
        aria-controls="main-navigation"
      >

        <span></span>
        <span></span>
        <span></span>

      </button>


      <nav
        class="main-nav"
        id="main-navigation"
        aria-label="التنقل الرئيسي"
      >

        <a href="index.html">
          الرئيسية
        </a>

        <a
          href="projects.html"
          aria-current="page"
        >
          المشاريع
        </a>

        <a href="about.html">
          عنّي
        </a>

        <a href="contact.html">
          تواصل
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main>

    <section
      class="projects-section section"
      aria-labelledby="projects-title"
    >

      <div class="container">

        <div class="section-heading">

          <div>

            <p class="eyebrow">
              SELECTED WORK
            </p>

            <h1 id="projects-title">
              المشاريع
            </h1>

          </div>


          <p class="section-description">
            مجموعة من الأعمال والمشاريع المختارة.
          </p>

        </div>


        <!-- =========================
             PROJECTS GRID
        ========================== -->

        <div
          id="projects-grid"
          class="projects-grid"
          aria-live="polite"
        >

          <div class="loading-state">

            <span
              class="loading-spinner"
              aria-hidden="true"
            ></span>

            <p>
              جاري تحميل المشاريع...
            </p>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="site-footer">

    <div class="container footer-content">

      <p>
        ©
        <span id="current-year"></span>
        B07 Portfolio
      </p>


      <a href="index.html">
        العودة للرئيسية
      </a>

    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    "use strict";


    /* =========================
       CURRENT YEAR
    ========================== */

    const yearElement =
      document.getElementById(
        "current-year"
      );


    if (yearElement) {

      yearElement.textContent =
        new Date().getFullYear();

    }


    /* =========================
       MOBILE MENU
    ========================== */

    const menuToggle =
      document.getElementById(
        "menu-toggle"
      );


    const mainNavigation =
      document.getElementById(
        "main-navigation"
      );


    if (
      menuToggle &&
      mainNavigation
    ) {

      menuToggle.addEventListener(
        "click",
        () => {

          const isOpen =
            menuToggle.getAttribute(
              "aria-expanded"
            ) === "true";


          menuToggle.setAttribute(
            "aria-expanded",
            String(!isOpen)
          );


          mainNavigation.classList.toggle(
            "is-open"
          );

        }
      );


      mainNavigation
        .querySelectorAll("a")
        .forEach((link) => {

          link.addEventListener(
            "click",
            () => {

              menuToggle.setAttribute(
                "aria-expanded",
                "false"
              );


              mainNavigation.classList.remove(
                "is-open"
              );

            }
          );

        });

    }

  </script>


  <!-- =========================
       SUPABASE PROJECTS
  ========================== -->

  <script
    src="app.js"
    defer
  ></script>

</body>

</html>
